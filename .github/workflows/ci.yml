name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dockerproxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: gofmt, vet, test
        run: |
          docker run --rm -v "$PWD/dockerproxy":/src -w /src -e GOFLAGS=-buildvcs=false golang:1.23-alpine \
            sh -c 'test -z "$(gofmt -l .)" && go vet ./... && go test ./...'

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD":/mnt koalaman/shellcheck:stable -x /mnt/installer/install.sh /mnt/installer/flamekeeper /mnt/installer/build.sh /mnt/installer/tests/e2e-clean-host.sh /mnt/scripts/dockerproxy-e2e.sh
      - run: docker run --rm -v "$PWD":/code -w /code bats/bats:latest installer/tests

  image-and-install:
    # Builds the controller image, then runs the installer on a fresh Ubuntu
    # (systemd, no Docker) and checks the result.
    needs: [backend, frontend, dockerproxy, installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t flamekeeper:dev --build-arg VERSION=ci .
      - run: installer/tests/e2e-clean-host.sh flamekeeper:dev
