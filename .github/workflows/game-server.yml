name: Game server

# Installs a released FlameKeeper on a GitHub runner and runs a real Enshrouded server
# through it: Steam download, online, backup, restore, restart, stop. Catches changes in
# the game or the mornedhels image (like the Proton crash at game 1.0) as well as
# FlameKeeper bugs. Runs after each release, weekly against the latest release, and on
# demand.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "FlameKeeper release to install, e.g. 0.5.0 (empty: latest; checkout: build this branch)"
        required: false
      image_tag:
        description: "Game image tag for the world (empty: FlameKeeper's default)"
        required: false

permissions:
  contents: read

jobs:
  game-server:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      FK_USER: keeper
    steps:
      - uses: actions/checkout@v7

      - name: Pick the release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${INPUT_VERSION:-${RUN_TAG:-}}"
          version="${version#v}"
          if [[ "$version" == checkout ]]; then
            url=""
          elif [[ -n "$version" ]]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version"
          else
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          fi
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Installing from ${url:-this checkout}"

      # The game (~9 GB), its image and the steamcmd image don't fit in the runner's
      # free space; the preinstalled SDKs we don't use free up ~30 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google
          sudo docker image prune -af >/dev/null
          df -h /
          nproc
          free -g

      - name: Build FlameKeeper from this checkout
        if: steps.release.outputs.url == ''
        run: docker build -t flamekeeper:ci --build-arg VERSION=ci --build-arg REPO="$GITHUB_REPOSITORY" .

      - name: Install FlameKeeper
        env:
          URL: ${{ steps.release.outputs.url }}
        run: |
          FK_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$FK_PASSWORD"
          echo "FK_PASSWORD=$FK_PASSWORD" >>"$GITHUB_ENV"
          args=(--yes --no-firewall --admin-user "$FK_USER")
          if [[ -n "$URL" ]]; then
            curl -fsSLO "$URL/install.sh"
            curl -fsSLO "$URL/install.sh.sha256"
            sha256sum -c install.sh.sha256
            installer=install.sh
          else
            installer=installer/install.sh
            args+=(--image flamekeeper:ci)
          fi
          sudo FLAMEKEEPER_ADMIN_PASSWORD="$FK_PASSWORD" bash "$installer" "${args[@]}"
          sudo flamekeeper status

      - name: Run a game server
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python3 scripts/ci/game_server_test.py --user "$FK_USER" --password "$FK_PASSWORD" \
            --image-tag "${IMAGE_TAG:-}"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          docker logs flamekeeper >logs/controller.log 2>&1 || true
          for c in $(docker ps -a --filter label=flamekeeper.managed --format '{{.Names}}'); do
            docker logs "$c" >"logs/$c.log" 2>&1 || true
          done
          sudo sh -c 'cp /srv/flamekeeper/worlds/*/game/server/enshrouded_server_readme.txt logs/' 2>/dev/null || true
          sudo chown -R "$USER" logs
          df -h /

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-server-logs
          path: logs/
