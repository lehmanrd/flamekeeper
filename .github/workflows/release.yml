name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Names
        id: names
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flamekeeper" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Enshrouded server is x86-64 only, so the controller ships for amd64 only.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.names.outputs.version }}
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest

      - name: Build installer
        run: installer/build.sh "$GITHUB_REPOSITORY" "${{ steps.names.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/install.sh.sha256 \
            --title "FlameKeeper ${{ steps.names.outputs.version }}" --generate-notes
